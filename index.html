    wakeOn(); refreshMetroUI();
  }
  function mStop() {
    M.running = false;
    clearInterval(M.timer); cancelAnimationFrame(M.raf);
    M.queue = []; litBeat(-1); wakeOff(); refreshMetroUI();
  }
  function restartBar() { if (M.running) { M.step = 0; M.queue = []; M.next = M.ctx.currentTime + 0.06; } }

  function renderMetro() {
    const m = data.metro;
    $('beatsSeg').innerHTML = [2, 3, 4, 6].map(n => `<button data-b="${n}" aria-pressed="${m.beats === n}">${n}拍</button>`).join('');
    $('subSeg').innerHTML = [[1, '4分'], [2, '8分'], [3, '3連'], [4, '16分']].map(([n, l]) => `<button data-s="${n}" aria-pressed="${m.sub === n}">${l}</button>`).join('');
    $('volRange').value = m.vol;
    const songs = data.songs.filter(s => s.bpm).sort((a, b) => RANK[a.status] - RANK[b.status] || b.created - a.created);
    const drills = data.drills.filter(d => d.bpm);
    const chips = arr => `<div class="chip-wrap">${arr.map(x => `<button class="chip-btn" data-pick="${x.bpm}" aria-pressed="false">${esc(x.title)}<span class="cnt">${x.bpm}</span></button>`).join('')}</div>`;
    $('bpmPicks').innerHTML = (songs.length ? `<span class="pick-group">曲</span>${chips(songs)}` : '')
      + (drills.length ? `<span class="pick-group">基礎練</span>${chips(drills)}` : '')
      || '<p>曲や基礎練にBPMを登録すると、ここから呼び出せます。</p>';
    refreshMetroUI();
  }
  const SUB_L = { 1: '4分', 2: '8分', 3: '3連', 4: '16分' };
  function refreshMetroUI() {
    const m = data.metro;
    if ($('bpmNum')) {
      $('bpmNum').textContent = m.bpm;
      $('bpmRange').value = m.bpm;
      $('mSub').textContent = `${m.beats}拍・${SUB_L[m.sub]}${M.running ? '・再生中' : ''}`;
      const dots = $('beatDots');
      if (dots.children.length !== m.beats) dots.innerHTML = Array.from({ length: m.beats }, (_, i) => `<span class="beat-dot${i ? '' : ' first'}"></span>`).join('');
      const p = $('mPlay');
      p.textContent = M.running ? 'ストップ' : 'スタート';
      p.classList.toggle('running', M.running);
      p.classList.toggle('done', !M.running);
      document.querySelectorAll('#bpmPicks [data-pick]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.pick === m.bpm)));
    }
    const dm = $('dMetro'), it = getItem();
    if (dm && it) {
      const on = M.running && it.bpm && m.bpm === it.bpm;
      dm.setAttribute('aria-pressed', String(!!on));
      dm.innerHTML = on ? '<span class="beat-mini"></span>止める' : it.bpm ? `${ICON.play}このBPMで鳴らす` : 'BPM未設定';
    }
  }
  function holdRepeat(btn, fn) {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault(); fn();
      t1 = setTimeout(() => { t2 = setInterval(fn, 70); }, 420);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => btn.addEventListener(n, stop));
    btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
  }
  holdRepeat($('bpmMinus'), () => setBpm(data.metro.bpm - 1));
  holdRepeat($('bpmPlus'), () => setBpm(data.metro.bpm + 1));
  $('bpmRange').addEventListener('input', e => setBpm(+e.target.value));
  $('mPlay').addEventListener('click', () => (M.running ? mStop() : mStart()));
  $('tapBtn').addEventListener('click', () => {
    const now = performance.now();
    M.taps = M.taps.filter(t => now - t < 2500);
    M.taps.push(now);
    if (M.taps.length > 5) M.taps.shift();
    if (M.taps.length >= 2) {
      const iv = (M.taps[M.taps.length - 1] - M.taps[0]) / (M.taps.length - 1);
      setBpm(60000 / iv);
    }
  });
  $('beatsSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-b]'); if (!b) return;
    data.metro.beats = +b.dataset.b; save(); restartBar(); renderMetro();
  });
  $('subSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    data.metro.sub = +b.dataset.s; save(); restartBar(); renderMetro();
  });
  $('volRange').addEventListener('input', e => { data.metro.vol = +e.target.value; save(); });
  $('bpmPicks').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (b) setBpm(+b.dataset.pick);
  });

  /* ---------- 設定・データ(右上の歯車) ---------- */
  function fmtDateTime(iso) {
    const d = new Date(iso); if (isNaN(d)) return '';
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function renderData() {
    $('lastExport').textContent = data.meta.lastExport ? `最後に書き出した日時:${fmtDateTime(data.meta.lastExport)}` : 'まだ書き出していません。';
    $('allStats').innerHTML = `
      <div class="stat"><b>${data.songs.length}</b><span>課題曲</span></div>
      <div class="stat"><b>${data.songs.filter(s => s.status === 'done').length}</b><span>弾ける</span></div>
      <div class="stat"><b>${data.drills.length}</b><span>基礎練</span></div>`;
  }
  const exportText = () => JSON.stringify(data, null, 2);
  const isTouch = () => matchMedia('(pointer: coarse)').matches;
  function openSettings() {
    openSheet($('settingsTpl').innerHTML, () => { bindData(); renderData(); });
  }
  document.querySelectorAll('[data-act="settings"]').forEach(b => b.addEventListener('click', openSettings));
  function bindData() {
    $('exportBtn').onclick = async () => {
      data.meta.lastExport = new Date().toISOString();
      save();
      const name = `bass-practice-${today()}.json`;
      const text = exportText();
      let file = null;
      try { file = new File([text], name, { type: 'application/json' }); } catch {}
      if (file && isTouch() && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); renderData(); return; }
        catch (e) { if (e && e.name === 'AbortError') { renderData(); return; } }
      }
      try {
        const url = URL.createObjectURL(file || new Blob([text], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
        toast('書き出しました');
      } catch { toast('書き出せませんでした。「コピー」を使ってください'); }
      renderData();
    };
    $('copyBtn').onclick = async () => {
      const area = $('copyArea');
      const text = exportText();
      area.value = text;
      try { await navigator.clipboard.writeText(text); toast('コピーしました'); area.hidden = true; }
      catch { area.hidden = false; area.focus(); area.select(); toast('自動でコピーできませんでした。下の欄を選択してコピーしてください'); }
    };
    $('importFile').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const box = $('importPreview');
        let v = null;
        try { v = JSON.parse(rd.result); } catch {}
        if (!valid(v)) {
          box.innerHTML = '<b>このファイルは読み込めません</b><p>ベース練習帳で書き出したJSONファイルを選んでください。</p>';
          box.hidden = false; return;
        }
        const marks = [...v.songs, ...v.drills].reduce((a, x) => a + (Array.isArray(x.videos) ? x.videos.reduce((b, y) => b + (Array.isArray(y.marks) ? y.marks.length : 0), 0) : 0), 0);
        box.innerHTML = `<b>${esc(f.name)}</b>
          <p>課題曲 ${v.songs.length}曲・基礎練 ${v.drills.length}件・ブックマーク ${marks}件${v.meta && v.meta.lastExport ? `(${fmtDateTime(v.meta.lastExport)} 書き出し)` : ''}</p>
          <p>今このブラウザにあるデータは消えて、このファイルの内容に置き換わります。</p>
          <div class="row-btns"><button class="btn" id="impCancel">やめる</button><button class="btn done" id="impOk">置き換える</button></div>`;
        box.hidden = false;
        box.querySelector('#impCancel').onclick = () => { box.hidden = true; };
        box.querySelector('#impOk').onclick = () => {
          data = migrate(v); save();
          closeSheet();
          if (detail) closeDetail();
          renderSongs(); renderDrills(); renderMetro(); toast('読み込みました');
        };
      };
      rd.readAsText(f);
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && M.running) wakeOn();
  });

  renderSongs();
  renderMetro();
  show();
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
